<!--
  Misma marca que brand-icon.svg, a sangre y sin esquinas redondeadas.

  La usan apple-touch-icon.png y los iconos PWA, porque iOS y Android aplican
  su propia mascara: un PNG que ya trae la esquina transparente termina
  compuesto sobre negro en iOS. El monograma queda dentro del 80% central,
  que es la zona segura de un icono maskable.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <rect width="128" height="128" fill="#0071E3"/>
  <path d="M 42 90 L 42 38 L 86 90 L 86 38"
        stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
