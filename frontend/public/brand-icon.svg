<!--
  Marca NutriPro: monograma "N" geometrico.

  Especificado en .claude/skills/apple-style-frontend/SKILL.md, seccion Marca.
  Trazo blanco de 13 sobre azulejo #0071E3 con radio 22.5% (28.8 de 128).
  Los remates redondos son parte de la especificacion: sin ellos el trazo se
  ve cortado en seco a tamaños pequeños.

  Esta es la variante con esquinas redondeadas, para uso dentro de la interfaz
  y como favicon. Para los iconos que el sistema operativo enmascara por su
  cuenta (apple-touch-icon, PWA) se usa brand-icon-square.svg, a sangre: si se
  les deja la esquina transparente, iOS la compone sobre negro.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none" aria-hidden="true">
  <rect width="128" height="128" rx="28.8" fill="#0071E3"/>
  <path d="M 42 90 L 42 38 L 86 90 L 86 38"
        stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
